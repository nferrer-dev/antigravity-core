<!DOCTYPE html>
<html>
<body>
    <div id="root">
        <div id="messages"></div>
    </div>
    <script>
        let syncCount = 0;
        
        function debouncedSync() {
            syncCount++;
        }

        window.__agyObserver = new MutationObserver((mutations) => {
            const hasReal = mutations.some(m => !(m.type === 'attributes' && (m.attributeName === 'data-ag-id' || m.attributeName === 'data-ag-rem' || m.attributeName === 'data-stable-id')));
            if (hasReal) {
                console.log("Real mutation detected:", mutations.map(m => m.type + ":" + m.attributeName));
                debouncedSync();
            } else {
                console.log("Ignored self-induced mutation:", mutations.length);
            }
        });

        window.__agyObserver.observe(document.body, { childList: true, attributes: true, subtree: true });

        async function captureSnapshot() {
            console.log("Starting captureSnapshot...");
            document.body.setAttribute('data-ag-id', '123'); // Our mutation
            await new Promise(r => setTimeout(r, 100));
            document.body.removeAttribute('data-ag-id');
            console.log("Finished captureSnapshot...");
        }

        async function runSpike() {
            // let DOM settle
            await new Promise(r => setTimeout(r, 50));
            // clear records
            window.__agyObserver.takeRecords();
            
            console.log("Spike started.");
            const capturePromise = captureSnapshot();
            
            setTimeout(() => {
                console.log("React is appending a new message!");
                const msg = document.createElement('div');
                msg.textContent = "Hello world";
                document.getElementById('messages').appendChild(msg);
            }, 50);

            await capturePromise;
            await new Promise(r => setTimeout(r, 20));
            console.log("Spike finished. Total syncs triggered:", syncCount);
            if (syncCount === 1) {
                console.log("VULNERABILITY FIXED: Real mutation was recovered!");
            }
        }
        
        runSpike();
    </script>
</body>
</html>
