# Antigravity Core — OpenAI Codex Repository Configuration
# Top-level keys MUST appear before any [section] header.
project_doc_fallback_filenames = ["CODEX.md"]
project_doc_max_bytes = 65536

[features]
codex_hooks = true

[mcp_servers.code-graph-context]
command = "cgc"
args = ["mcp", "start"]
startup_timeout_sec = 20

# Optional: uncomment if running a local Cortex vector memory server on port 8585
# [mcp_servers.cortex]
# url = "http://127.0.0.1:8585/mcp"

# Suppress duplicate discovery of .agents/skills/* inside antigravity-core
# so Codex uses the Codex-native .codex/skills/* definitions.
[[skills.config]]
path = ".agents/skills/brainstorm-solutions/SKILL.md"
enabled = false

